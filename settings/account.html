<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mon compte - Arvest</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../dist/output.css" />
</head>
<body class="bg-[#f5f8fa] font-poppins min-h-screen">
  <div id="navbar-placeholder"></div>
  <main class="max-w-3xl mx-auto mt-24 px-4 pb-16">
    <h1 class="text-3xl font-bold text-gray-900 mb-8">Mon compte</h1>
    <section class="bg-white rounded-2xl shadow p-8">
      <h2 class="text-xl font-semibold mb-4 text-orange-600">Informations personnelles</h2>
      <form id="account-form" class="flex flex-col gap-6">
        <div>
          <label class="block text-gray-700 mb-1" for="account-name">Nom</label>
          <input type="text" id="account-name" class="w-full px-4 py-2 rounded border border-gray-200 focus:ring-2 focus:ring-orange-400 focus:outline-none" value="Emmanuel Nsabua">
        </div>
        <div>
          <label class="block text-gray-700 mb-1" for="account-email">Email</label>
          <input type="email" id="account-email" class="w-full px-4 py-2 rounded border border-gray-200 focus:ring-2 focus:ring-orange-400 focus:outline-none" value="emmanuel@email.com">
        </div>
        <div>
          <label class="block text-gray-700 mb-1" for="account-username">Nom d'utilisateur</label>
          <input type="text" id="account-username" class="w-full px-4 py-2 rounded border border-gray-200 focus:ring-2 focus:ring-orange-400 focus:outline-none" value="emmanuel">
        </div>
        <div>
          <label class="block text-gray-700 mb-1" for="account-password">Mot de passe</label>
          <input type="password" id="account-password" class="w-full px-4 py-2 rounded border border-gray-200 focus:ring-2 focus:ring-orange-400 focus:outline-none" value="••••••••">
        </div>
        <div class="flex justify-end">
          <button type="submit" class="px-6 py-2 bg-orange-500 text-white rounded font-semibold hover:bg-orange-600 transition">Enregistrer</button>
        </div>
      </form>
    </section>
  </main>
  <div id="footer-placeholder"></div>
  <script type="module" src="../js/load-components.js"></script>
  <script>
    document.getElementById('account-form').onsubmit = e => {
      e.preventDefault();
      alert('Modifications enregistrées !');
    };
  </script>
</body>
</html>
