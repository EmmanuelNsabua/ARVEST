<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notifications - Arvest</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../dist/output.css" />
</head>
<body class="bg-[#f5f8fa] font-poppins min-h-screen">
  <div id="navbar-placeholder"></div>
  <main class="max-w-3xl mx-auto mt-24 px-4 pb-16">
    <h1 class="text-3xl font-bold text-gray-900 mb-8">Notifications</h1>
    <section id="notifications-list" class="flex flex-col gap-4">
      <!-- Les notifications seront injectées dynamiquement ici -->
    </section>
  </main>
  <div id="footer-placeholder"></div>
  <script type="module" src="../js/load-components.js"></script>
  <script type="module">
    // Mock notifications
    const notifications = [
      {
        icon: "bx bx-message-rounded-dots",
        title: "Nouveau commentaire",
        text: "Sophie M. a commenté votre conte « Le lion et le lièvre ».",
        time: "il y a 2 min",
        unread: true
      },
      {
        icon: "bx bx-user-plus",
        title: "Nouveau follower",
        text: "Patrick K. a commencé à vous suivre.",
        time: "il y a 1 h",
        unread: false
      },
      {
        icon: "bx bx-like",
        title: "Nouvel avis",
        text: "Votre proverbe a reçu un nouveau like.",
        time: "il y a 3 h",
        unread: false
      }
    ];
    function renderNotifications() {
      const list = document.getElementById('notifications-list');
      list.innerHTML = notifications.map(n => `
        <div class="flex items-start gap-4 p-4 rounded-xl shadow bg-white border-l-4 ${n.unread ? 'border-orange-500' : 'border-gray-200'}">
          <div class="flex items-center justify-center w-12 h-12 rounded-full bg-orange-100 text-orange-600 text-2xl">
            <i class="${n.icon}"></i>
          </div>
          <div class="flex-1">
            <div class="font-semibold text-gray-900">${n.title}</div>
            <div class="text-gray-600 text-sm">${n.text}</div>
            <div class="text-xs text-gray-400 mt-1">${n.time}</div>
          </div>
        </div>
      `).join('');
    }
    document.addEventListener('DOMContentLoaded', renderNotifications);
  </script>
</body>
</html>
