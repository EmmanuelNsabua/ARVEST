<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Événements - Arvest</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../dist/output.css" />
</head>
<body class="bg-[#f5f8fa] dark:bg-[#18181b] font-poppins min-h-screen">
  <div id="navbar-placeholder"></div>
  <main class="max-w-5xl mx-auto mt-24 px-4 pb-16">
    <h1 class="text-3xl font-bold text-gray-900 mb-8">Événements & ateliers</h1>
    <section id="events-list" class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <!-- Les événements seront injectés dynamiquement ici -->
    </section>
  </main>
  <div id="footer-placeholder"></div>
  <script type="module" src="../js/load-components.js"></script>
  <script type="module">
    // Mock événements
    const events = [
      {
        title: "Atelier de contes pour enfants",
        date: "Samedi 15 juin 2024",
        place: "Kinshasa, Centre culturel",
        desc: "Venez écouter et partager des contes traditionnels avec les enfants. Animations, jeux et goûter offerts.",
        img: "../assets/events/atelier-enfants.jpg"
      },
      {
        title: "Soirée Proverbes & Musique",
        date: "Vendredi 21 juin 2024",
        place: "Lubumbashi, Maison de la Culture",
        desc: "Une soirée conviviale autour des proverbes, de la musique et de la danse. Ouvert à tous.",
        img: "../assets/events/soiree-proverbes.jpg"
      },
      {
        title: "Conférence : Préserver la tradition orale",
        date: "Jeudi 27 juin 2024",
        place: "En ligne (Zoom)",
        desc: "Experts et passionnés échangent sur la sauvegarde du patrimoine oral africain. Inscription gratuite.",
        img: "../assets/events/conference-tradition.jpg"
      },
      {
        title: "Atelier d'écriture de contes",
        date: "Samedi 6 juillet 2024",
        place: "Goma, Bibliothèque municipale",
        desc: "Initiez-vous à l'art du conte et repartez avec votre propre histoire écrite.",
        img: "../assets/events/atelier-ecriture.jpg"
      }
    ];
    function renderEvents() {
      const list = document.getElementById('events-list');
      list.innerHTML = events.map(e => `
        <div class="bg-white rounded-2xl shadow p-6 flex flex-col gap-3 hover:shadow-lg transition">
          <img src="${e.img}" alt="${e.title}" class="w-full h-40 object-cover rounded-lg mb-3">
          <h2 class="font-bold text-lg text-orange-600 mb-1">${e.title}</h2>
          <div class="flex items-center gap-3 text-sm text-gray-500 mb-1">
            <i class="bx bx-calendar"></i> <span>${e.date}</span>
            <i class="bx bx-map"></i> <span>${e.place}</span>
          </div>
          <p class="text-gray-700 text-sm mb-2">${e.desc}</p>
          <button class="px-4 py-2 bg-orange-500 text-white rounded-full font-semibold hover:bg-orange-600 transition w-max">S'inscrire</button>
        </div>
      `).join('');
    }
    document.addEventListener('DOMContentLoaded', renderEvents);
  </script>
</body>
</html>
