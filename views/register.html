<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inscription - Arvest</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../dist/output.css" />
  <style>
    body {
      min-height: 100vh;
      font-family: 'Poppins', sans-serif;
    }
    .astro-bg {
      background: url('https://ik.imagekit.io/melfuviii/Arvest/assets/index/7074398_1_.jpg?updatedAt=1751244898356') center/cover no-repeat;
    }
    @media (max-width: 900px) {
      .astro-bg { min-height: 220px; }
    }
  </style>
</head>
<body class="bg-gray-100 dark:bg-[#18181b] font-poppins">
  <!-- NAVBAR dynamique -->
  <div id="navbar-placeholder"></div>
  <div class="min-h-screen flex items-center justify-center py-10">
    <div class="bg-white/90 dark:bg-[#23232b]/90 mt-16 rounded-3xl shadow-2xl flex flex-col md:flex-row w-full max-w-4xl overflow-hidden">
      <!-- Illustration / Left -->
      <div class="astro-bg flex-1 flex flex-col justify-between items-center p-8 hidden md:flex" style="background: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);">
        <div class="w-full flex flex-col items-center justify-center h-full">
          <img src="https://ik.imagekit.io/melfuviii/Arvest/assets/index/7074398_1_.jpg?updatedAt=1751244898356" alt="Astro" class="w-40 h-40 mb-6 drop-shadow-xl">
          <h2 class="text-white text-2xl font-bold mb-2 text-center drop-shadow">Exploring new frontiers, one step at a Time.</h2>
        </div>
      </div>
      <!-- Form / Right -->
      <div class="flex-1 flex flex-col justify-center p-8 bg-white dark:bg-[#23232b]">
        <div class="w-full max-w-md mx-auto">
          <!-- Onglets inscription/connexion -->
          <div class="flex justify-between items-center mb-6">
            <div class="flex gap-2 w-full">
              <button id="tab-register" class="flex-1 py-2 rounded-t-lg font-bold text-gray-900 bg-orange-100">Créer un compte</button>
              <button id="tab-login" class="flex-1 py-2 rounded-t-lg font-bold text-gray-500 hover:text-orange-600 hover:bg-orange-50 transition">Connexion</button>
            </div>
          </div>
          <!-- Formulaire inscription -->
          <div id="register-section">
            <div class="flex gap-2 mb-6">
              <button class="flex-1 flex items-center justify-center gap-2 px-4 py-2 rounded-full border border-gray-200 bg-gray-50 hover:bg-gray-100 transition text-sm font-semibold">
                <i class="bx bxl-google text-lg"></i> Google
              </button>
              <button class="flex-1 flex items-center justify-center gap-2 px-4 py-2 rounded-full border border-gray-200 bg-gray-50 hover:bg-gray-100 transition text-sm font-semibold">
                <i class="bx bxl-facebook text-lg"></i> Facebook
              </button>
            </div>
            <div class="flex items-center gap-2 mb-6">
              <div class="flex-1 h-px bg-gray-200"></div>
              <span class="text-xs text-gray-400">ou</span>
              <div class="flex-1 h-px bg-gray-200"></div>
            </div>
            <form class="flex flex-col gap-4" autocomplete="off">
              <input type="text" placeholder="Nom" class="px-4 py-3 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-[#23232b] focus:ring-2 focus:ring-orange-400 focus:outline-none text-sm dark:text-gray-100" required>
              <input type="email" placeholder="Email ou téléphone" class="px-4 py-3 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-[#23232b] focus:ring-2 focus:ring-orange-400 focus:outline-none text-sm dark:text-gray-100" required>
              <input type="text" placeholder="Nom d'utilisateur" class="px-4 py-3 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-[#23232b] focus:ring-2 focus:ring-orange-400 focus:outline-none text-sm dark:text-gray-100" required>
              <input type="password" placeholder="Mot de passe" class="px-4 py-3 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-[#23232b] focus:ring-2 focus:ring-orange-400 focus:outline-none text-sm dark:text-gray-100" required>
              <div class="flex items-center gap-2 text-xs text-gray-500">
                <input type="checkbox" id="terms" required class="accent-orange-500">
                <label for="terms">J'accepte les <a href="#" class="text-orange-600 hover:underline">conditions d'utilisation</a></label>
              </div>
              <button type="submit" class="w-full py-3 rounded-full bg-[#2d174d] text-white font-semibold text-base hover:bg-orange-600 transition mt-2">S'inscrire</button>
            </form>
          </div>
          <!-- Formulaire connexion -->
          <div id="login-section" class="hidden">
            <div class="flex gap-2 mb-6">
              <button class="flex-1 flex items-center justify-center gap-2 px-4 py-2 rounded-full border border-gray-200 bg-gray-50 hover:bg-gray-100 transition text-sm font-semibold">
                <i class="bx bxl-google text-lg"></i> Google
              </button>
              <button class="flex-1 flex items-center justify-center gap-2 px-4 py-2 rounded-full border border-gray-200 bg-gray-50 hover:bg-gray-100 transition text-sm font-semibold">
                <i class="bx bxl-facebook text-lg"></i> Facebook
              </button>
            </div>
            <div class="flex items-center gap-2 mb-6">
              <div class="flex-1 h-px bg-gray-200"></div>
              <span class="text-xs text-gray-400">ou</span>
              <div class="flex-1 h-px bg-gray-200"></div>
            </div>
            <form class="flex flex-col gap-4" autocomplete="off">
              <input type="email" placeholder="Email ou nom d'utilisateur" class="px-4 py-3 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-[#23232b] focus:ring-2 focus:ring-orange-400 focus:outline-none text-sm dark:text-gray-100" required>
              <input type="password" placeholder="Mot de passe" class="px-4 py-3 rounded-lg border border-gray-200 dark:border-gray-700 bg-white dark:bg-[#23232b] focus:ring-2 focus:ring-orange-400 focus:outline-none text-sm dark:text-gray-100" required>
              <div class="flex items-center justify-between text-xs text-gray-500">
                <label class="flex items-center gap-2">
                  <input type="checkbox" class="accent-orange-500"> Se souvenir de moi
                </label>
                <a href="#" class="text-orange-600 hover:underline">Mot de passe oublié ?</a>
              </div>
              <button type="submit" class="w-full py-3 rounded-full bg-orange-500 text-white font-semibold text-base hover:bg-orange-600 transition mt-2">Se connecter</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <!-- Mobile version illustration -->
  <div class="md:hidden block w-full max-w-xs mx-auto mb-8">
    <div class="astro-bg rounded-3xl overflow-hidden flex flex-col items-center justify-center py-8">
      <img src="../assets/register/astro.png" alt="Astro" class="w-24 h-24 mb-4 drop-shadow-xl">
      <h2 class="text-white text-lg font-bold text-center drop-shadow">Exploring new frontiers, one step at a Time.</h2>
    </div>
  </div>
  <script type="module" src="../js/load-components.js"></script>
  <script type="module">
    // Tab switcher
    const tabRegister = document.getElementById('tab-register');
    const tabLogin = document.getElementById('tab-login');
    const registerSection = document.getElementById('register-section');
    const loginSection = document.getElementById('login-section');
    tabRegister.addEventListener('click', () => {
      tabRegister.classList.add('bg-orange-100', 'text-gray-900');
      tabLogin.classList.remove('bg-orange-100', 'text-gray-900');
      tabLogin.classList.add('text-gray-500');
      registerSection.classList.remove('hidden');
      loginSection.classList.add('hidden');
    });
    tabLogin.addEventListener('click', () => {
      tabLogin.classList.add('bg-orange-100', 'text-gray-900');
      tabRegister.classList.remove('bg-orange-100', 'text-gray-900');
      tabRegister.classList.add('text-gray-500');
      loginSection.classList.remove('hidden');
      registerSection.classList.add('hidden');
    });
  </script>
</body>
</html>
