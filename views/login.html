<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Connexion - Arvest</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../style/main.css" />
  <link rel="stylesheet" href="../style/login.css" />
</head>
<body>
  <!-- NAVBAR -->
  <div id="navbar-placeholder"></div>
  <!-- END NAVBAR -->

  <main>
    <section class="login-section">
      <div class="login-card">
        <h2 class="login-title"><i class="bx bx-log-in"></i> Connexion</h2>
        <!-- ...existing code... -->
        <div class="login-social">
          <button type="button" class="btn social-btn google-btn">
            <i class="bx bxl-google"></i> Continuer avec Google
          </button>
          <button type="button" class="btn social-btn facebook-btn">
            <i class="bx bxl-facebook"></i> Continuer avec Facebook
          </button>
          <div class="login-divider"><span>ou</span></div>
        </div>
        <!-- ...existing code... -->
        <form class="login-form" autocomplete="off">
          <div class="input-group">
            <label for="email"><i class="bx bx-envelope"></i> Email</label>
            <input type="email" id="email" name="email" placeholder="Votre email" required>
          </div>
          <div class="input-group">
            <label for="password"><i class="bx bx-lock"></i> Mot de passe</label>
            <input type="password" id="password" name="password" placeholder="Votre mot de passe" required>
          </div>
          <button type="submit" class="btn primary-btn login-submit"><i class="bx bx-log-in"></i> Se connecter</button>
        </form>
        <div class="login-links">
          <a href="#">Mot de passe oublié ?</a>
          <span> | </span>
          <a href="register.html">Créer un compte</a>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="../js/script.js"></script>
  <script type="module" src="../js/load-components.js"></script>
</body>
</html>
