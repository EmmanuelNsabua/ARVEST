<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Explorer | Arvest Congo</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../dist/output.css" />
</head>
<body class="bg-[#f5f8fa] font-poppins text-gray-800">
  <!-- NAVBAR -->
  <div id="navbar-placeholder"></div>

  <!-- HERO BANNER NOUVEAUTÉS (carousel style index) -->
  <section class="relative w-full flex justify-center mt-24">
    <div class="relative w-[85vw] max-w-6xl h-[420px] rounded-3xl overflow-hidden shadow-lg flex items-center bg-gray-900">
      <div class="absolute inset-0 z-0">
        <img id="explore-hero-bg" src="" alt="Bannière Explore" class="w-full h-full object-cover object-center brightness-75 transition-all duration-700" />
      </div>
      <div class="absolute inset-0 bg-gradient-to-r from-black/90 via-black/60 to-transparent z-10"></div>
      <div class="relative z-20 flex flex-col justify-center h-full px-8 py-12 max-w-xl">
        <span class="text-lg text-orange-400 font-semibold mb-2" id="explore-hero-badge"></span>
        <h1 id="explore-hero-title" class="text-3xl md:text-5xl font-extrabold text-white mb-4 drop-shadow-lg leading-tight"></h1>
        <p id="explore-hero-desc" class="text-lg text-gray-100 mb-8 max-w-2xl drop-shadow"></p>
        <a href="#feed" id="explore-banner-btn" class="inline-flex items-center gap-2 px-8 py-3 bg-orange-500 text-white rounded-full font-semibold shadow hover:bg-orange-600 transition text-lg">
          <i class="bx bx-chevron-down text-2xl"></i>
          Voir les publications
        </a>
      </div>
      <!-- Carousel dots dynamiques -->
      <div class="absolute bottom-6 left-1/2 -translate-x-1/2 flex gap-2 z-30" id="explore-hero-dots"></div>
    </div>
  </section>

  <!-- CAROUSEL NOUVEAUTÉS (horizontal, pas de scrollbar) -->
  <section class="w-[85vw] max-w-7xl mx-auto mt-16 px-4">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-2xl md:text-3xl font-bold text-orange-600">Nouveautés</h2>
      <a href="#" class="text-orange-600 font-semibold hover:underline">Tout voir</a>
    </div>
    <div id="carousel-nouveautes" class="flex gap-8 overflow-x-auto pb-4 snap-x snap-mandatory no-scrollbar carousel-nouveautes"></div>
  </section>

  <!-- PUBLICATIONS FEED (dynamique) -->
  <section id="feed" class="w-[85vw] max-w-7xl mx-auto mt-16 px-2 flex flex-col gap-8">
    <div id="publications-list"></div>
  </section>

  <!-- CAROUSEL SUGGESTIONS (auteurs à suivre, contes à lire, etc.) -->
  <section class="w-[85vw] max-w-7xl mx-auto mt-20 px-4">
    <h2 class="text-2xl md:text-3xl font-bold text-orange-600 mb-8">Suggestions d'auteurs à suivre</h2>
    <div id="carousel-suggestions" class="flex gap-8 overflow-x-auto pb-4 snap-x snap-mandatory no-scrollbar carousel-suggestions"></div>
  </section>

  <!-- Publications supplémentaires après suggestions -->
  <section class="w-[85vw] max-w-7xl mx-auto mt-16 px-2 flex flex-col gap-8" id="more-publications"></section>

  <script type="module" src="../js/script.js"></script>
  <script type="module" src="../js/load-components.js"></script>
  <script type="module" src="../js/explore-publications.js"></script>
  <script>
    // Ajoute le scroll smooth sur le bouton de la bannière
    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('explore-banner-btn');
      if (btn) {
        btn.addEventListener('click', function(e) {
          e.preventDefault();
          const target = document.getElementById('feed');
          if (target) target.scrollIntoView({ behavior: 'smooth' });
        });
      }
    });
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .line-clamp-4 {
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .pub-comments-block {
      min-height: 320px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }
    .pub-comments {
      flex: 1 1 auto;
      overflow-y: auto;
      max-height: 320px;
      margin-bottom: 56px;
    }
    .pub-comment-form {
      position: absolute;
      left: 2rem;
      right: 2rem;
      bottom: 2rem;
      margin-bottom: 0 !important;
      background: transparent;
    }
    @media (max-width: 900px) {
      .w-\[85vw\] { width: 98vw !important; }
      .max-w-7xl { max-width: 100vw !important; }
    }
  </style>
</body>
</html>
