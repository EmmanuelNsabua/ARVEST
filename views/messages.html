<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Messages - Arvest</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../dist/output.css" />
</head>
<body class="bg-[#f5f8fa] font-poppins min-h-screen">
  <div id="navbar-placeholder"></div>
  <main class="max-w-5xl mx-auto mt-24 px-4 pb-16">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
      <!-- Liste des conversations -->
      <aside class="md:col-span-1 bg-white dark:bg-[#23232b] rounded-2xl shadow p-4 flex flex-col gap-2">
        <h2 class="text-lg font-semibold text-gray-800 mb-4">Conversations</h2>
        <ul id="conversations-list" class="flex flex-col gap-2">
          <!-- Conversations dynamiques -->
        </ul>
      </aside>
      <!-- Fenêtre de messages -->
      <section class="md:col-span-2 bg-white dark:bg-[#23232b] rounded-2xl shadow p-4 flex flex-col h-[500px]">
        <div class="flex items-center gap-3 mb-4 border-b pb-3">
          <img id="chat-user-img" src="../assets/profile/profile2.jpg" class="w-10 h-10 rounded-full object-cover" alt="User">
          <div>
            <div id="chat-user-name" class="font-semibold text-gray-900">Sophie M.</div>
            <div class="text-xs text-gray-500">En ligne</div>
          </div>
        </div>
        <div id="messages-list" class="flex-1 flex flex-col gap-3 overflow-y-auto mb-4 px-1">
          <!-- Messages dynamiques -->
        </div>
        <form id="message-form" class="flex items-center gap-2 mt-auto">
          <input type="text" id="message-input" placeholder="Écrire un message..." class="flex-1 px-4 py-2 rounded-full border border-gray-200 bg-gray-50 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400" required>
          <button type="submit" class="px-5 py-2 bg-orange-500 text-white rounded-full font-semibold hover:bg-orange-600 transition">Envoyer</button>
        </form>
      </section>
    </div>
  </main>
  <div id="footer-placeholder"></div>
  <script type="module" src="../js/load-components.js"></script>
  <script type="module">
    // Mock conversations/messages
    const conversations = [
      {
        id: 1,
        name: "Sophie M.",
        img: "../assets/profile/profile2.jpg",
        last: "Merci pour ton conte !",
        unread: true,
        messages: [
          { from: "Sophie M.", img: "../assets/profile/profile2.jpg", text: "Merci pour ton conte !" },
          { from: "Vous", img: "../assets/profile/profile.jpg", text: "Avec plaisir !" }
        ]
      },
      {
        id: 2,
        name: "Patrick K.",
        img: "../assets/profile/profile3.jpg",
        last: "On échange sur les proverbes ?",
        unread: false,
        messages: [
          { from: "Vous", img: "../assets/profile/profile.jpg", text: "Salut Patrick !" },
          { from: "Patrick K.", img: "../assets/profile/profile3.jpg", text: "On échange sur les proverbes ?" }
        ]
      }
    ];
    let currentConv = conversations[0];

    function renderConversations() {
      const list = document.getElementById('conversations-list');
      list.innerHTML = conversations.map(conv => `
        <li class="flex items-center gap-3 p-2 rounded cursor-pointer hover:bg-orange-50 transition ${conv.unread ? 'bg-orange-100' : ''}" data-id="${conv.id}">
          <img src="${conv.img}" class="w-8 h-8 rounded-full object-cover" alt="${conv.name}">
          <div class="flex-1">
            <div class="font-semibold text-gray-800 text-sm">${conv.name}</div>
            <div class="text-xs text-gray-500 truncate">${conv.last}</div>
          </div>
          ${conv.unread ? '<span class="w-2 h-2 rounded-full bg-orange-500"></span>' : ''}
        </li>
      `).join('');
    }

    function renderMessages(conv) {
      document.getElementById('chat-user-img').src = conv.img;
      document.getElementById('chat-user-name').textContent = conv.name;
      const list = document.getElementById('messages-list');
      list.innerHTML = conv.messages.map(m => `
        <div class="flex ${m.from === 'Vous' ? 'justify-end' : 'justify-start'}">
          <div class="flex items-end gap-2">
            ${m.from !== 'Vous' ? `<img src="${m.img}" class="w-8 h-8 rounded-full object-cover" alt="${m.from}">` : ''}
            <div class="px-4 py-2 rounded-2xl ${m.from === 'Vous' ? 'bg-orange-500 text-white' : 'bg-gray-100 text-gray-800'} shadow text-sm max-w-xs">${m.text}</div>
            ${m.from === 'Vous' ? `<img src="${m.img}" class="w-8 h-8 rounded-full object-cover" alt="${m.from}">` : ''}
          </div>
        </div>
      `).join('');
      list.scrollTop = list.scrollHeight;
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderConversations();
      renderMessages(currentConv);

      // Switch conversation
      document.getElementById('conversations-list').addEventListener('click', e => {
        const li = e.target.closest('li[data-id]');
        if (!li) return;
        const id = parseInt(li.getAttribute('data-id'), 10);
        currentConv = conversations.find(c => c.id === id);
        renderConversations();
        renderMessages(currentConv);
      });

      // Send message
      document.getElementById('message-form').addEventListener('submit', e => {
        e.preventDefault();
        const input = document.getElementById('message-input');
        const val = input.value.trim();
        if (!val) return;
        currentConv.messages.push({ from: "Vous", img: "../assets/profile/profile.jpg", text: val });
        renderMessages(currentConv);
        input.value = '';
      });
    });
  </script>
</body>
</html>
</html>
